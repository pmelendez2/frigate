# AI-assisted: OpenAI ChatGPT; maintainer review required.

name: Frigate HailoRT CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  isolated:
    name: isolated
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check shell scripts
        run: |
          bash -n scripts/build-frigate-local.sh \
            scripts/preflight-build.sh \
            scripts/check-frigate-changes.sh \
            scripts/prepare-hailort-source.sh \
            scripts/test-ci-image.sh \
            scripts/prepare-frigate-version.sh \
            scripts/check-build-context.sh \
            scripts/test-frigate-image.sh \
            scripts/test-frigate-deployment.sh
          bash -n .githooks/pre-commit .githooks/pre-push
      - name: Verify fork changes, not upstream history
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor v0.18.2 HEAD
          bash scripts/check-frigate-changes.sh --range v0.18.2
          bash scripts/check-frigate-changes.sh --worktree
          python3 scripts/check-public-content.py
      - name: Unit-test fork privacy checker
        run: |
          python3 -m unittest discover \
            -s scripts/tests -p 'test_*.py' -v
      - name: Validate documentation and release version
        run: |
          python3 scripts/check-documentation.py
          python3 scripts/sync-release-docs.py --check
          python3 -m unittest discover \
            -s tests -p 'test_sync_release_docs.py' -v
          python3 scripts/check-public-content.py
      - name: Validate version and build contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat release/VERSION)" = 0.18.2-hailort-4.24.0
          grep -Fq 'COPY --from=hailort-src' docker/main/Dockerfile
          grep -Fq -- '-DHAILO_BUILD_SERVICE=ON' \
            docker/main/build_hailort_mps.sh
          grep -Fq 'FROM deps AS frigate' docker/main/Dockerfile

  image-build:
    name: image-build-${{ matrix.arch }}
    needs: isolated
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generate Frigate build version
        shell: bash
        run: |
          bash scripts/preflight-build.sh
          bash scripts/prepare-frigate-version.sh
          bash scripts/check-build-context.sh
      - name: Export pinned HailoRT source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-hailort-source.sh \
            "$RUNNER_TEMP/hailort-src"
      - uses: docker/setup-buildx-action@v4
      - name: Build image locally without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/main/Dockerfile
          target: frigate
          platforms: linux/${{ matrix.arch }}
          build-contexts: |
            hailort-src=${{ runner.temp }}/hailort-src
          load: true
          push: false
          tags: frigate:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=frigate-${{ matrix.arch }}
          cache-to: type=gha,scope=frigate-${{ matrix.arch }},mode=max
      - name: Software smoke test without Hailo hardware
        shell: bash
        run: |
          bash scripts/test-ci-image.sh \
            frigate:ci-${{ matrix.arch }} \
            ${{ matrix.arch }}
