# AI-assisted: OpenAI ChatGPT; maintainer review required.

name: Publish Frigate HailoRT multi-architecture image

on:
  push:
    tags:
      - 'frigate-hailort-v*'

permissions:
  contents: read

concurrency:
  group: frigate-docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify release tag and main ancestry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="frigate-hailort-v$(cat release/VERSION)"
          test "$GITHUB_REF_NAME" = "$expected"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          # GitHub verifies the tag signature. This supports both SSH and
          # OpenPGP signatures without storing signing keys on runners.
          tag_object="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{tag}")"
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
          printf '%s' "$response" | python3 -c '
          import json
          import sys
          data = json.load(sys.stdin)
          assert data.get("verification", {}).get("verified") is True, (
              "Release tag signature is not verified by GitHub"
          )'
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          bash scripts/preflight-build.sh

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    environment: dockerhub-release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generate Frigate build version
        shell: bash
        run: |
          bash scripts/preflight-build.sh
          bash scripts/prepare-frigate-version.sh
          bash scripts/check-build-context.sh
      - name: Export pinned HailoRT source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-hailort-source.sh \
            "$RUNNER_TEMP/hailort-src"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: pmelendez2
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image locally for platform smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/main/Dockerfile
          target: frigate
          platforms: linux/${{ matrix.arch }}
          build-contexts: |
            hailort-src=${{ runner.temp }}/hailort-src
          load: true
          push: false
          tags: frigate:release-${{ matrix.arch }}
          cache-from: type=gha,scope=frigate-${{ matrix.arch }}
          cache-to: type=gha,scope=frigate-${{ matrix.arch }},mode=max
      - name: Verify HailoRT runtime in image (no Hailo device)
        shell: bash
        run: |
          bash scripts/test-ci-image.sh \
            frigate:release-${{ matrix.arch }} \
            ${{ matrix.arch }}
      - name: Build and publish platform-specific digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/main/Dockerfile
          target: frigate
          platforms: linux/${{ matrix.arch }}
          build-contexts: |
            hailort-src=${{ runner.temp }}/hailort-src
          outputs: type=image,name=docker.io/pmelendez2/frigate,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=min
          sbom: true
          cache-from: type=gha,scope=frigate-${{ matrix.arch }}
          cache-to: type=gha,scope=frigate-${{ matrix.arch }},mode=max
      - name: Save digest for manifest assembly
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: dockerhub-release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: pmelendez2
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish verified multi-platform manifest
        shell: bash
        run: |
          set -euo pipefail
          image=docker.io/pmelendez2/frigate
          version="$(cat release/VERSION)"
          mapfile -t hashes < <(
            find "$RUNNER_TEMP/digests" -maxdepth 1 -type f \
              -printf '%f\n' | sort
          )
          test "${#hashes[@]}" -eq 2
          refs=()
          for hash in "${hashes[@]}"; do
            [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
            refs+=("$image@sha256:$hash")
          done
          docker buildx imagetools create \
            -t "$image:$version" \
            -t "$image:sha-${GITHUB_SHA:0:12}" \
            "${refs[@]}"
          bash scripts/verify-published-image.sh "$image:$version"
