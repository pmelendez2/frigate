# SPDX-License-Identifier: MIT
# AI-assisted: OpenAI ChatGPT; maintainer review required.
# Publish only images exported by the successful main-branch CI run.
name: Publish Frigate HailoRT verified images

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main-branch Frigate HailoRT CI run ID
        required: true
        type: string
      stage:
        description: Publish RC from CI artifacts, or promote RC without rebuild
        required: true
        type: choice
        options:
          - rc
          - stable
      rc_number:
        description: RC sequence number (default 1)
        required: true
        default: '1'
        type: string
      hardware_verified:
        description: Confirm ARM64 hardware test before RC publication
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: frigate-docker-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.contract.outputs.version }}
      rc_tag: ${{ steps.contract.outputs.rc_tag }}
      ci_sha: ${{ steps.contract.outputs.ci_sha }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify release and CI artifact contract
        id: contract
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ inputs.ci_run_id }}
          STAGE: ${{ inputs.stage }}
          RC_NUMBER: ${{ inputs.rc_number }}
          HARDWARE_VERIFIED: ${{ inputs.hardware_verified }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$CI_RUN" =~ ^[0-9]+$ ]]
          [[ "$RC_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$STAGE" == rc || "$STAGE" == stable ]]
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]
          version="$(cat release/VERSION)"
          rc_tag="${version}-rc.${RC_NUMBER}"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN")"
          ci_sha="$(RUN_JSON="$run_json" python3 - <<'PY'
          import json
          import os
          import re
          run = json.loads(os.environ['RUN_JSON'])
          expected = {
              'head_branch': 'main',
              'event': 'push',
              'conclusion': 'success',
              'name': 'Frigate HailoRT CI',
          }
          for field, value in expected.items():
              if run.get(field) != value:
                  raise SystemExit(
                      f'FAIL: CI run {field} is {run.get(field)!r}, '
                      f'expected {value!r}'
                  )
          sha = run.get('head_sha', '')
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('FAIL: invalid CI commit SHA')
          print(sha)
          PY
          )"
          git cat-file -e "$ci_sha^{commit}"
          git merge-base --is-ancestor "$ci_sha" "$GITHUB_SHA" || {
            echo 'FAIL: CI commit is not an ancestor of release main'
            exit 1
          }
          if [[ "$ci_sha" != "$GITHUB_SHA" ]]; then
            changes="$(git diff --name-only "$ci_sha" "$GITHUB_SHA")"
            while IFS= read -r changed; do
              [[ -z "$changed" ]] && continue
              case "$changed" in
                .github/workflows/docker-publish.yml|\
                docs/INSTALL_HAILORT_4.24.md|\
                docs/BUILD_ONCE_RELEASE.md|\
                docs/CI_DOCKER_RELEASE.md|\
                HAILO8.md|\
                CHANGELOG.md|\
                docs/releases/0.18.3-hailort-4.24.0.md)
                  echo "Allowed release-only change: $changed" ;;
                *)
                  echo "FAIL: CI image is stale after change: $changed"
                  exit 1 ;;
              esac
            done <<< "$changes"
          fi
          echo "PASS: CI commit $ci_sha is verified for release main"
          echo "ci_sha=$ci_sha" >> "$GITHUB_OUTPUT"
          [[ "$HARDWARE_VERIFIED" == true ]] || {
            echo 'FAIL: Hardware verification must be explicitly confirmed'
            exit 1
          }
          if [[ "$STAGE" == stable ]]; then
            RELEASE_VERSION="$version" python3 - <<'PY'
          import os
          import pathlib
          import re
          version = os.environ["RELEASE_VERSION"]
          notes = pathlib.Path(f"docs/releases/{version}.md")
          if not notes.is_file():
              raise SystemExit("FAIL: versioned release notes are missing")
          body = notes.read_text(encoding="utf-8")
          required = ("## Fixed issues", "## Known limitations",
                      "## Final hardware acceptance")
          for heading in required:
              if heading not in body:
                  raise SystemExit(f"FAIL: missing release notes {heading}")
          def acceptance_value(label):
              pattern = (
                  r"(?m)^\|\s*" + re.escape(label) +
                  r"\s*\|\s*([^|\n]+?)\s*\|\s*$"
              )
              matches = re.findall(pattern, body)
              if len(matches) != 1:
                  raise SystemExit(
                      f"FAIL: missing/duplicate acceptance row: {label}"
                  )
              return matches[0].strip()
          if acceptance_value("Status") != "ACCEPTED":
              raise SystemExit("FAIL: RC hardware acceptance not recorded")
          digest = acceptance_value("RC ARM64 digest")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("FAIL: hardware-tested RC digest missing")
          for label in (
              "Hardware test date",
              "Hardware/OS/kernel",
              "Host driver/runtime",
              "Frigate camera inference",
              "Second MPS client using group `SHARED`",
              "RC identity and rollback verification",
          ):
              value = acceptance_value(label)
              if not value or "PENDING" in value.upper():
                  raise SystemExit(f"FAIL: incomplete acceptance: {label}")
          if "Stable documentation: APPROVED" not in body:
              raise SystemExit("FAIL: stable documentation not approved")
          if version not in body:
              raise SystemExit("FAIL: release version missing in notes")
          print("PASS: documented RC hardware and stable approval")
          PY
          else
            echo "PASS: RC hardware attestation recorded by dispatcher"
          fi
          if [[ "$STAGE" == stable ]]; then
            tag="frigate-hailort-v${version}"
            tag_sha="$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              --jq '.object.sha')"
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
              --jq '{verified: .verification.verified, type: .object.type, target: .object.sha}' |
              TAG_TARGET="$GITHUB_SHA" python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)
          assert data["verified"] is True, "Unsigned release tag"
          assert data["type"] == "commit", "Tag must target commit"
          assert data["target"] == os.environ["TAG_TARGET"], "Tag SHA mismatch"
          '
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rc_tag=$rc_tag" >> "$GITHUB_OUTPUT"
      - name: Run security, privacy and build preflight
        run: bash scripts/preflight-build.sh
      - name: Verify current-release documentation versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          version = Path("release/VERSION").read_text().strip()
          notes = Path(f"docs/releases/{version}.md")
          required = (Path("CHANGELOG.md"), notes)
          for path in required:
              if not path.is_file():
                  raise SystemExit(f"FAIL: missing {path}")
              if version not in path.read_text():
                  raise SystemExit(f"FAIL: wrong version in {path}")
          current = ("docs/INSTALL_HAILORT_4.24.md",
                     "docs/BUILD_ONCE_RELEASE.md",
                     "docs/CI_DOCKER_RELEASE.md")
          for name in current:
              body = Path(name).read_text()
              if "0.18.2-hailort-4.24-mps" in body:
                  raise SystemExit(f"FAIL: stale tag example in {name}")
              for tag in re.findall(
                  r"(?:docker\.io/pmelendez2/)?frigate:(0\.18\.\d+"
                  r"-hailort-4\.24\.0(?:-rc\.\d+)?)", body):
                  if tag != version and not tag.startswith(version + "-rc."):
                      raise SystemExit(f"FAIL: mismatched {tag} in {name}")
          print("PASS: current-release documentation versions")
          PY

      - name: Clearly report release verification results
        env:
          CI_RUN: ${{ inputs.ci_run_id }}
          CI_SHA: ${{ steps.contract.outputs.ci_sha }}
          VERSION: ${{ steps.contract.outputs.version }}
          STAGE: ${{ inputs.stage }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Frigate release verification'
            echo ''
            echo "- Source CI run: \`$CI_RUN\`"
            echo "- Verified source commit: \`$CI_SHA\`"
            echo "- Release version: \`$VERSION\`"
            echo "- Publication stage: \`$STAGE\`"
            echo '- Original CI images are reused; no builds are performed'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Release contract verified for $VERSION ($STAGE)"

  rc:
    if: inputs.stage == 'rc'
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    environment: dockerhub-release
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
      - name: Enable ARM64 emulation for software checks
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Configure Docker Buildx for manifest creation
        uses: docker/setup-buildx-action@v4
      - name: Check Docker Hub token is configured
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::DOCKERHUB_TOKEN is not configured'
            exit 1
          fi
          echo '::notice::Docker Hub token exists (value hidden)'
      - name: Authenticate to Docker Hub
        uses: docker/login-action@v4
        with:
          username: pmelendez2
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Start RC publication summary
        env:
          RC_TAG: ${{ needs.verify.outputs.rc_tag }}
          CI_RUN: ${{ inputs.ci_run_id }}
        run: |
          {
            echo '## Frigate Docker Hub RC publication'
            echo ''
            echo "- RC tag: \`$RC_TAG\`"
            echo "- Source CI run: \`$CI_RUN\`"
            echo '- Image builds: **none** (original CI artifacts reused)'
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify and load amd64 image from original CI
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ inputs.ci_run_id }}
          CI_SHA: ${{ needs.verify.outputs.ci_sha }}
          ARCH: amd64
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Checking existing $ARCH image from CI run $CI_RUN"
          dir="$RUNNER_TEMP/frigate-$ARCH"
          mkdir -p "$dir"
          echo "::group::Download $ARCH CI artifact"
          gh run download "$CI_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "frigate-image-$ARCH" \
            --dir "$dir"
          echo '::endgroup::'
          echo "::group::Verify $ARCH artifact provenance and checksum"
          (cd "$dir" && sha256sum -c image.tar.zst.sha256)
          grep -Fx "sha=$CI_SHA" "$dir/build.txt"
          grep -Fx "arch=$ARCH" "$dir/build.txt"
          grep -Fx "version=$(cat release/VERSION)" "$dir/build.txt"
          echo '::endgroup::'
          echo "::group::Load the existing $ARCH image without rebuilding"
          zstd -dc "$dir/image.tar.zst" | docker load
          image="frigate:ci-$ARCH"
          actual="$(docker image inspect "$image" \
            --format '{{.Architecture}}')"
          [[ "$actual" == "$ARCH" ]]
          image_id="$(docker image inspect "$image" \
            --format '{{.Id}}')"
          grep -Fx "image_id=$image_id" "$dir/build.txt"
          echo "Verified image ID: $image_id"
          echo '::endgroup::'
          echo "::group::Run $ARCH software smoke tests"
          bash scripts/test-ci-image.sh "$image" "$ARCH"
          echo '::endgroup::'
          echo "::notice::PASS: $ARCH artifact and smoke tests"
          {
            echo "- ✅ $ARCH: existing CI image verified and smoke tested"
            echo "  (image ID: \`$image_id\`)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify and load arm64 image from original CI
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ inputs.ci_run_id }}
          CI_SHA: ${{ needs.verify.outputs.ci_sha }}
          ARCH: arm64
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Checking existing $ARCH image from CI run $CI_RUN"
          dir="$RUNNER_TEMP/frigate-$ARCH"
          mkdir -p "$dir"
          echo "::group::Download $ARCH CI artifact"
          gh run download "$CI_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "frigate-image-$ARCH" \
            --dir "$dir"
          echo '::endgroup::'
          echo "::group::Verify $ARCH artifact provenance and checksum"
          (cd "$dir" && sha256sum -c image.tar.zst.sha256)
          grep -Fx "sha=$CI_SHA" "$dir/build.txt"
          grep -Fx "arch=$ARCH" "$dir/build.txt"
          grep -Fx "version=$(cat release/VERSION)" "$dir/build.txt"
          echo '::endgroup::'
          echo "::group::Load the existing $ARCH image without rebuilding"
          zstd -dc "$dir/image.tar.zst" | docker load
          image="frigate:ci-$ARCH"
          actual="$(docker image inspect "$image" \
            --format '{{.Architecture}}')"
          [[ "$actual" == "$ARCH" ]]
          image_id="$(docker image inspect "$image" \
            --format '{{.Id}}')"
          grep -Fx "image_id=$image_id" "$dir/build.txt"
          echo "Verified image ID: $image_id"
          echo '::endgroup::'
          echo "::group::Run $ARCH software smoke tests"
          bash scripts/test-ci-image.sh "$image" "$ARCH"
          echo '::endgroup::'
          echo "::notice::PASS: $ARCH artifact and smoke tests"
          {
            echo "- ✅ $ARCH: existing CI image verified and smoke tested"
            echo "  (image ID: \`$image_id\`)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Push verified amd64 image to Docker Hub
        env:
          RC_TAG: ${{ needs.verify.outputs.rc_tag }}
          ARCH: amd64
        shell: bash
        run: |
          set -euo pipefail
          image=docker.io/pmelendez2/frigate
          tag="$image:$RC_TAG-$ARCH"
          echo "::notice::Publishing existing $ARCH image as $tag"
          docker tag "frigate:ci-$ARCH" "$tag"
          docker push "$tag"
          echo "::notice::PASS: Published $tag"
          echo "- ✅ Published \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Push verified arm64 image to Docker Hub
        env:
          RC_TAG: ${{ needs.verify.outputs.rc_tag }}
          ARCH: arm64
        shell: bash
        run: |
          set -euo pipefail
          image=docker.io/pmelendez2/frigate
          tag="$image:$RC_TAG-$ARCH"
          echo "::notice::Publishing existing $ARCH image as $tag"
          docker tag "frigate:ci-$ARCH" "$tag"
          docker push "$tag"
          echo "::notice::PASS: Published $tag"
          echo "- ✅ Published \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Create and verify the multiarchitecture RC manifest
        env:
          RC_TAG: ${{ needs.verify.outputs.rc_tag }}
        shell: bash
        run: |
          set -euo pipefail
          image=docker.io/pmelendez2/frigate
          tag="$image:$RC_TAG"
          echo "::notice::Creating multiarchitecture manifest for $tag"
          docker buildx imagetools create \
            -t "$tag" \
            "$image:$RC_TAG-amd64" \
            "$image:$RC_TAG-arm64"
          bash scripts/verify-published-image.sh "$tag"
          digest="$(docker buildx imagetools inspect "$tag" |
            awk '/^Digest:/ {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo '::error::Could not obtain published manifest digest'
            exit 1
          }
          echo "::notice::Published $tag with digest $digest"
          {
            echo ''
            echo '### RC publication successful'
            echo "- Docker Hub image: \`$tag\`"
            echo '- Platforms: `linux/amd64`, `linux/arm64`'
            echo "- Manifest digest: \`$digest\`"
            echo '- Image builds: **none**'
          } >> "$GITHUB_STEP_SUMMARY"

  stable:
    if: inputs.stage == 'stable'
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: dockerhub-release
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
      - name: Configure Docker Buildx for manifest promotion
        uses: docker/setup-buildx-action@v4
      - name: Check Docker Hub token is configured
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::DOCKERHUB_TOKEN is not configured'
            exit 1
          fi
          echo '::notice::Docker Hub token exists (value hidden)'
      - name: Authenticate to Docker Hub
        uses: docker/login-action@v4
        with:
          username: pmelendez2
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify the published RC manifest before promotion
        env:
          RC_TAG: ${{ needs.verify.outputs.rc_tag }}
        shell: bash
        run: |
          set -euo pipefail
          image=docker.io/pmelendez2/frigate
          echo "::notice::Checking existing RC manifest $image:$RC_TAG"
          bash scripts/verify-published-image.sh "$image:$RC_TAG"
      - name: Promote verified RC to stable without rebuilding
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          RC_TAG: ${{ needs.verify.outputs.rc_tag }}
        shell: bash
        run: |
          set -euo pipefail
          image=docker.io/pmelendez2/frigate
          echo "::notice::Promoting $image:$RC_TAG to $image:$VERSION"
          docker buildx imagetools create \
            -t "$image:$VERSION" \
            "$image:$RC_TAG"
          echo '::notice::Stable promotion completed without image rebuild'
      - name: Verify published stable manifest and report digest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          RC_TAG: ${{ needs.verify.outputs.rc_tag }}
        shell: bash
        run: |
          set -euo pipefail
          image=docker.io/pmelendez2/frigate
          tag="$image:$VERSION"
          bash scripts/verify-published-image.sh "$tag"
          digest="$(docker buildx imagetools inspect "$tag" |
            awk '/^Digest:/ {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo '::error::Could not obtain stable manifest digest'
            exit 1
          }
          {
            echo '## Frigate Docker Hub stable publication'
            echo ''
            echo "- Stable tag: \`$tag\`"
            echo "- Promoted from: \`$image:$RC_TAG\`"
            echo '- Platforms: `linux/amd64`, `linux/arm64`'
            echo "- Manifest digest: \`$digest\`"
            echo '- Image builds: **none** (RC manifest promoted)'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::PASS: Stable $tag published, digest $digest"
